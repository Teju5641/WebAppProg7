
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flower Finding Game</title>

    <style>
        .game-container {
            width: 600px;
        }

        .game-row {
            display: flex;
        }

        .game-location {
            width: 100px;
            height: 100px;
            padding: 3px;
            box-sizing: border-box;
        }

        .game-location img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Lakshmi Tejaswini Davuluri finds avians</h1>

    <p>Click on the locations to find the flowers, watch out for the poison ivy</p>

    <p id="locations">Number of locations checked is zero.</p>

    <p id="score">Score is zero.</p>

    <p onclick="help()" style="cursor: pointer;">
        Click for help.
    </p>

    <p id="help">Help report</p>

    <div class="game-container">

            <div class="game-location"><img id="img9" src="images/bush.jpg" alt="Bush" onclick="check(9)"></div>
            <div class="game-location"><img id="img10" src="images/bush.jpg" alt="Bush" onclick="check(10)"></div>

            <div class="game-location"><img id="img14" src="images/bush.jpg" alt="Bush" onclick="check(14)"></div>
            <div class="game-location"><img id="img15" src="images/bush.jpg" alt="Bush" onclick="check(15)"></div>
            <div class="game-location"><img id="img16" src="images/bush.jpg" alt="Bush" onclick="check(16)"></div>
            <div class="game-location"><img id="img17" src="images/bush.jpg" alt="Bush" onclick="check(17)"></div>

    <script>
        let ids = [
            "img0", "img1", "img2", "img3", "img4", "img5",
            "img6", "img7", "img8", "img9", "img10", "img11",
            "img12", "img13", "img14", "img15", "img16", "img17",
            "img18", "img19", "img20", "img21", "img22", "img23",
            "img24", "img25", "img26", "img27", "img28", "img29",
            "img30", "img31", "img32", "img33", "img34", "img35"
        ];

        let score = 0;
        let locationsVisited = 0;
        let lastLocation = 0;

        let poisonLocation = 19;
        let roseLocation = 14;
        let lilyLocations = [3, 25];
        let daisyLocations = [2, 5, 11, 20, 21];

        let gameOver = false;
        let scoredLocations = [];

      
        function check(position) {
            if (gameOver) {
                return;
            }

            let id = ids[position];
            let image = document.getElementById(id);

         
            if (!scoredLocations.includes(position)) {
                if (position === poisonLocation) {
                    image.src = "images/poisonivy.jpg";
                    score -= 4;
                    gameOver = true;
                    scoredLocations.push(position);
                }
                else if (position === roseLocation) {
                    image.src = "images/rose.jpg";
                    score += 4;
                    scoredLocations.push(position);
                }
                else if (lilyLocations.includes(position)) {
                    image.src = "images/lily.jpg";
                    score += 2;
                    scoredLocations.push(position);
                }
                else if (daisyLocations.includes(position)) {
                    image.src = "images/daisy.jpg";
                    score += 1;
                    scoredLocations.push(position);
                }
            }

            locationsVisited++;
            lastLocation = position;

            document.getElementById("locations").innerHTML =
                "Number of locations checked is " + locationsVisited + ".";

            document.getElementById("score").innerHTML =
                "Score is " + score + ".";
        }

        function help() {
            let result = "warm";

            let neighbors = [
                (lastLocation + 1) % 36,
                (lastLocation + 35) % 36,
                (lastLocation + 6) % 36,
                (lastLocation + 30) % 36
            ];

            // Check for daisies first
            for (let location of neighbors) {
                if (daisyLocations.includes(location)) {
                    result = "cold";
                    document.getElementById("help").innerHTML = result;
                    return;
                }
            }

            let row = Math.floor(lastLocation / 6);
            let col = lastLocation % 6;

            let nearby = [];

            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < 6 && c >= 0 && c < 6) {
                        nearby.push(r * 6 + c);
                    }
                }
            }

            if (nearby.includes(roseLocation)) {
                result = "hot";
            }
            else if (nearby.includes(poisonLocation)) {
                result = "watch out";
            }

            document.getElementById("help").innerHTML = result;
        }
    </script>

</body>
</html>
