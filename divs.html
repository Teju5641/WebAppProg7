<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Building a List with DIVs</title>

    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
            background-color: lightblue;
            padding: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .divlist {
            background-color: white;
            margin: 5px;
            padding: 15px;
            font-size: 20px;
            border: 1px solid black;
        }

        button {
            padding: 8px 15px;
            margin: 10px 5px;
        }

        input {
            padding: 8px;
        }
    </style>
</head>

<body>

    <h1>Lakshmi Tejaswini Davuluri builds list with divs</h1>

    <input type="text" id="inputText" placeholder="Enter text">

    <button onclick="addEnd()">Add end</button>
	<button onclick="addFront()">Add front</button>
	<button onclick="removeEveryOther()">Remove</button>
	<button onclick="shuffle()">Shuffle</button>

    <div class="flex-container" id="container">
        <div class="divlist">Item 1</div>
        <div class="divlist">Item 2</div>
        <div class="divlist">Item 3</div>
    </div>

    <script>
        function addEnd() {
            let input = document.getElementById("inputText");

            let newDiv = document.createElement("div");

            newDiv.innerHTML = input.value;
            newDiv.className = "divlist";

            let container = document.getElementById("container");

            container.appendChild(newDiv);
        }

        function addFront() {
            let input = document.getElementById("inputText");

            let newDiv = document.createElement("div");

            newDiv.innerHTML = input.value;
            newDiv.className = "divlist";

            let container = document.getElementById("container");

            container.insertBefore(newDiv, container.firstChild);
        }

        
		function removeEveryOther() {
			let divListItems = document.getElementsByClassName("divlist");

			let length = divListItems.length;

			for (let i = length - 1; i >= 0; i--) {
				if (i % 2 === 0) {
					divListItems[i].remove();
				}
			}
		}

		function shuffle() {
			let items = document.getElementsByClassName("divlist");

			if (items.length < 2) {
				return;
			}

			let first = Math.floor(Math.random() * items.length);
			let second = Math.floor(Math.random() * items.length);

			while (first === second) {
				second = Math.floor(Math.random() * items.length);
			}

			let temp = items[first].innerHTML;
			items[first].innerHTML = items[second].innerHTML;
			items[second].innerHTML = temp;
		}
		</script>


</body>
</html>
